<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Valyrian Dictionary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <!-- Slide-out Hamburger Sidebar Navigation -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Lexicon Menu</h3>
        </div>
        <ul class="nav-links">
            <li><a href="#" onclick="navigateTo('all')">✨ Main Dashboard</a></li>
        </ul>
        <div id="dynamicNavMenu"></div>
    </nav>

    <!-- Screen overlay to dismiss drawer on mobile touch grids -->
    <div id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Main Workspace Application Engine Container -->
    <div class="app-layout">
        <header class="main-header">
            <button id="menuToggleBtn" onclick="toggleSidebar()">☰</button>
            <h1 id="pageMainTitle">High Valyrian Lexicon Dashboard</h1>
        </header>

    <!-- The rest of your index.html continues identically below -->

        <div id="adminPanel" class="input-section hidden">
            <h3 id="panelTitle">Add / Edit Entry</h3>
            
            <label style="font-size: 13px; color: #94a3b8; margin-bottom: -5px;">Curriculum Grouping:</label>
            <select id="sectionGroup">
                <option value="Unit 1, Section 1">Unit 1, Section 1</option>
                <option value="Unit 1, Section 2">Unit 1, Section 2</option>
                <option value="Unit 1, Section 1">Unit 1, Section 3</option>
            </select>

            <input type="text" id="wordInput" placeholder="High Valyrian token or phrase (e.g., Ñuha)">
            
            <textarea id="definitionInput" oninput="autoDetectPOS()" placeholder="English translation or sentence meaning..." rows="3"></textarea>
            
            <div id="posWrapper">
                <label style="font-size: 13px; color: #94a3b8; margin-bottom: -5px;">Parts of Speech (Auto-detected):</label>
                <div class="checkbox-grid">
                    <label><input type="checkbox" value="noun" class="pos-checkbox"> Noun</label>
                    <label><input type="checkbox" value="verb" class="pos-checkbox"> Verb</label>
                    <label><input type="checkbox" value="adjective" class="pos-checkbox"> Adjective</label>
                    <label><input type="checkbox" value="adverb" class="pos-checkbox"> Adverb</label>
                    <label><input type="checkbox" value="possessive-adjective" class="pos-checkbox"> Possessive Adjective</label>
                    <label><input type="checkbox" value="possessive-pronoun" class="pos-checkbox"> Possessive Pronoun</label>
                </div>
            </div>

            <button id="submitBtn" class="submit-btn" onclick="submitWord()">Commit to Lexicon</button>
            <button class="minimal-btn" style="margin-top: 5px;" onclick="exportJSON()">📥 Export words.json File</button>
        </div>

        <main>
            <p>Still Under Construction and working on the dictionary engine, and identifying grammar identifiers and patterns. I am learning as much as you are. Enjoy!!!</p>
            <div id="dictionaryContainer"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
